trigger:
  branches:
    include:
      - master
pr:
  branches:
    include:
      - master
jobs:
  - job: Test
    strategy:
      matrix:
        Linux:
          imageName: 'ubuntu-latest'
        Windows:
          imageName: 'windows-latest'
    pool:
      vmImage: $(imageName)
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '24.x'
      - pwsh: |
          node --version
          npm run test
          npm run build
  - job: Package
    dependsOn: Test
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '24.x'
      - pwsh: npm run package
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.SourcesDirectory)/dist'
          artifact: 'flyway-vsix'
