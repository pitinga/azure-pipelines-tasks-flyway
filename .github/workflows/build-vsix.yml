name: Build Flyway extension VSIX

on:
  push:
    branches:
      - feature/modernize-node24-v1
      - feature/optional-cli-config-installer-version
      - fix/overview-link-v1.1.4
      - master
    paths-ignore:
      - '**/*.vsix'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: flyway-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node 24 runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1); console.log('Node ' + process.version)"
      - name: Run tests
        run: npm test
      - name: Build tasks
        run: npm run build
      - name: Package VSIX with official TFX CLI
        run: npx --yes tfx-cli@0.24.2 extension create --manifest-globs vss-extension.json --output-path dist
      - name: Verify VSIX content
        shell: python
        run: |
          import glob, json, zipfile
          packages = glob.glob('dist/*.vsix')
          assert len(packages) == 1, f'Expected one VSIX, got {packages}'
          package = packages[0]
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              assert 'extension.vsixmanifest' in names
              assert 'extension.vsomanifest' in names
              assert '[Content_Types].xml' in names
              for task in ['FlywayCLI','FlywayInstaller']:
                  assert f'{task}/task.json' in names, task
                  assert f'{task}/index.cjs' in names, task
                  assert f'{task}/runtime.cjs' in names, task
                  task_info = json.loads(archive.read(f'{task}/task.json'))
                  assert list(task_info['execution']) == ['Node24'], task_info['execution']
                  assert task_info['minimumAgentVersion'] == '4.265.1'
              print(f'Verified package: {package}; {len(names)} entries')
      - name: Read extension version
        id: ext-version
        run: echo "version=$(node -p 'require("./vss-extension.json").version')" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: flyway-tasks-v${{ steps.ext-version.outputs.version }}-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 90
