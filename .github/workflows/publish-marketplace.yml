name: Publish Flyway to Azure DevOps Marketplace

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite PUBLICAR para confirmar a publicação no Marketplace'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: flyway-marketplace-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLICAR'
    runs-on: ubuntu-latest
    environment: marketplace-production
    timeout-minutes: 20
    steps:
      - name: Checkout approved release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use previously verified release tag when present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("vss-extension.json"))["version"])')
          tag="v$version"
          if sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            git checkout --detach "$sha"
            actual=$(python3 -c 'import json; print(json.load(open("vss-extension.json"))["version"])')
            if [[ "$actual" != "$version" ]]; then
              echo "::error::Tag $tag aponta para versao diferente."
              exit 1
            fi
            echo "Publicando exatamente o codigo da tag $tag ($sha)."
          else
            echo "Tag $tag ainda nao existe; sera criada apos publicacao bem-sucedida."
          fi
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node 24 runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1); console.log('Node ' + process.version)"
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Create VSIX
        run: npx --yes tfx-cli@0.24.2 extension create --manifest-globs vss-extension.json --output-path dist
      - name: Validate extension package
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          packages = glob.glob('dist/*.vsix')
          assert len(packages) == 1, f'Expected exactly one VSIX: {packages}'
          with zipfile.ZipFile(packages[0]) as z:
              for name in ('extension.vsixmanifest', 'extension.vsomanifest', 'FlywayInstaller/task.json', 'FlywayCLI/task.json'):
                  assert name in z.namelist(), f'Missing {name}'
              for task in ('FlywayInstaller', 'FlywayCLI'):
                  spec = json.loads(z.read(f'{task}/task.json'))
                  assert list(spec['execution']) == ['Node24']
                  assert spec['minimumAgentVersion'] == '4.265.1'
              manifest = json.load(open('vss-extension.json'))
              assert manifest['publisher'] == 'pitinga'
              assert manifest['id'] == 'pitinga-database-migration-tasks'
          print('VSIX verified:', packages[0])
          PY
      - name: Publish to Marketplace
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VS_MARKETPLACE_TOKEN:-}" ]]; then
            echo "::error::Crie o secret VS_MARKETPLACE_TOKEN no environment marketplace-production."
            exit 1
          fi
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Esperado um unico VSIX; encontrados ${#packages[@]}."
            exit 1
          fi
          npx --yes tfx-cli@0.24.2 extension publish \
            --publisher pitinga \
            --vsix "${packages[0]}" \
            --auth-type pat \
            --token "$VS_MARKETPLACE_TOKEN"
      - name: Register published version on GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("vss-extension.json"))["version"])')
          tag="v$version"
          sha=$(git rev-parse HEAD)
          package=$(find dist -maxdepth 1 -type f -name '*.vsix' -print -quit)
          test -n "$package"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [[ "$existing" != "$sha" ]]; then
              echo "::error::A tag $tag ja aponta para $existing e nao sera movida."
              exit 1
            fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" >/dev/null
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create "$tag" "$package" --repo "$GITHUB_REPOSITORY" --target "$sha" --title "Flyway Tasks $version" --generate-notes --latest
          fi
          echo "Marketplace publicado e GitHub Release $tag concluida."
